services:
  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-erohub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erohub}
      POSTGRES_DB: ${DB_NAME:-erohub}
    volumes:
      - ${DB_DATA_DIR:-./db/data}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erohub}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: auth/Dockerfile
    command: ["alembic", "-c", "db/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-erohub}:${DB_PASSWORD:-erohub}@db:5432/${DB_NAME:-erohub}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "${AUTH_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-erohub}:${DB_PASSWORD:-erohub}@db:5432/${DB_NAME:-erohub}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      AUTH_SERVICE_URL: http://auth:8001
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-erohub}:${DB_PASSWORD:-erohub}@db:5432/${DB_NAME:-erohub}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /app/storage
      MODEL_DIR: /app/models
      ERAX_MODEL_SIZE: ${ERAX_MODEL_SIZE:-m}
      ERAX_MODEL_REVISION: ${ERAX_MODEL_REVISION:-90878ab981060833413ae1a24df72f5e1fff66bc}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PRESIGNED_URLS: ${S3_USE_PRESIGNED_URLS:-true}
      S3_PRESIGN_EXPIRES: ${S3_PRESIGN_EXPIRES:-3600}
      ML_WORKERS: ${ML_WORKERS:-0}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      MAX_VIDEO_SIZE: ${MAX_VIDEO_SIZE:-209715200}
      MAX_VIDEO_DURATION: ${MAX_VIDEO_DURATION:-300}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
    volumes:
      - storage:/app/storage
      - hf_cache:/root/.cache/huggingface
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  studio:
    build:
      context: ./studio
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  storage:
  hf_cache:
  redis-data:
