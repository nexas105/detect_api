# Optional Redis override — use with: docker compose -f docker-compose.yml -f docker-compose.redis.yml up
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  auth:
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis-data:
